plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.brainstormer'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	implementation 'io.github.cdimascio:dotenv-java:3.2.0'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'com.mysql:mysql-connector-j'

    implementation 'org.flywaydb:flyway-mysql'
	// Source: https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-flyway
	implementation 'org.springframework.boot:spring-boot-starter-flyway:4.1.0-M4'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named("bootRun") {
	jvmArgs = ['-javaagent:newrelic/newrelic.jar']

	// Load .env and expose it to the JVM as real environment variables.
	// The New Relic agent reads NEW_RELIC_* env vars at startup (premain), which
	// happens before main() runs - so dotenv-java loaded inside main() is too late
	// for the agent. Injecting here makes .env the single source of truth for both
	// Spring and New Relic.
	def envFile = file('.env')
	if (envFile.exists()) {
		envFile.readLines().each { line ->
			line = line.trim()
			if (line && !line.startsWith('#') && line.contains('=')) {
				int idx = line.indexOf('=')
				environment line.substring(0, idx).trim(), line.substring(idx + 1).trim()
			}
		}
	}
}