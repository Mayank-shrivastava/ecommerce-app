spring:
  application:
    name: ecommerce-app
  datasource:
    url: jdbc:mysql://localhost:3306/ecommercedb
    username: ${USER_NAME}
    password: ${PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate  

  flyway:
    enabled: true
    locations: classpath:db/migrations

  redis:
    host: localhost
    port: 6379
